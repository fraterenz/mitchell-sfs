[project]
name = "mitchell-sfs"
version = "0.1.0"
description = "Compute donor site-frequency spectra from Mitchell 2022 mutation matrices"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jaxtyping",
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
]

[project.scripts]
mitchell-sfs = "mitchell_sfs.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
